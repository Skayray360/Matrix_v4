<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1375" viewBox="0 0 1320 1375" role="img" aria-labelledby="title desc">
<title id="title">Matrix RH: arquitectura local de la aplicacion</title><desc id="desc">Flujo del navegador a la API, cola, RAG autorizado, modelo y datos locales, con observabilidad y despliegue.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#7d94ab"/></marker></defs>
<rect width="1320" height="1375" rx="24" fill="#080e17"/>
<text x="52" y="65" fill="#37d7e6" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700">MATRIX RH / ARQUITECTURA LOCAL</text>
<text x="52" y="104" fill="#a6b9cc" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Perfil predeterminado: Windows + WAMP + identidad local + Ollama</text>
<rect x="360" y="142" width="600" height="113" rx="14" fill="#101c2b" stroke="#2b4053" stroke-width="2"/>
<rect x="360" y="158" width="4" height="81" rx="2" fill="#37d7e6"/>
<text x="384" y="179" fill="#37d7e6" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">USUARIO / REACT</text>
<text x="384" y="215" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Pregunta, adjunta archivos y consulta sus fuentes.</text>
<path d="M660,255 L660,292" stroke="#7d94ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="197" y="305" width="926" height="118" rx="14" fill="#101c2b" stroke="#2b4053" stroke-width="2"/>
<rect x="197" y="321" width="4" height="86" rx="2" fill="#70dba3"/>
<text x="221" y="342" fill="#70dba3" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">FRONTERA HTTP / FASTAPI</text>
<text x="221" y="378" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Apache loopback → API :8000 · Sesión + CSRF + permisos + límites</text>
<text x="221" y="406" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Los documentos son datos no confiables; no autorizan acciones.</text>
<path d="M660,423 L660,458" stroke="#7d94ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="197" y="470" width="926" height="119" rx="14" fill="#101c2b" stroke="#2b4053" stroke-width="2"/>
<rect x="197" y="486" width="4" height="87" rx="2" fill="#b18bff"/>
<text x="221" y="507" fill="#b18bff" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">ORQUESTACIÓN / agents/</text>
<text x="221" y="543" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Cola de chat → contexto autorizado → recuperación o consulta estructurada</text>
<text x="221" y="571" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Presupuestos de contexto, plazo global y cancelación cooperativa.</text>
<path d="M660,589 L660,617 L239,617 L239,644" stroke="#7d94ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M660,589 L660,617 L660,617 L660,644" stroke="#7d94ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M660,589 L660,617 L1081,617 L1081,644" stroke="#7d94ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="52" y="656" width="374" height="157" rx="14" fill="#101c2b" stroke="#2b4053" stroke-width="2"/>
<rect x="52" y="672" width="4" height="125" rx="2" fill="#70dba3"/>
<text x="76" y="693" fill="#70dba3" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">RAG / CONOCIMIENTO</text>
<text x="76" y="729" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">ACL antes de recuperar</text>
<text x="76" y="757" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Qdrant + selección documental</text>
<text x="76" y="785" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Grounding y citas verificables</text>
<rect x="473" y="656" width="374" height="157" rx="14" fill="#101c2b" stroke="#2b4053" stroke-width="2"/>
<rect x="473" y="672" width="4" height="125" rx="2" fill="#83b9ff"/>
<text x="497" y="693" fill="#83b9ff" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">LLM / MODELO</text>
<text x="497" y="729" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Ollama local :11434</text>
<text x="497" y="757" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Gemma: generación</text>
<text x="497" y="785" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">EmbeddingGemma: vectores</text>
<rect x="894" y="656" width="374" height="157" rx="14" fill="#101c2b" stroke="#2b4053" stroke-width="2"/>
<rect x="894" y="672" width="4" height="125" rx="2" fill="#efc776"/>
<text x="918" y="693" fill="#efc776" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">DATOS ESTRUCTURADOS</text>
<text x="918" y="729" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Catálogo aprobado por TI</text>
<text x="918" y="757" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Plan validado → SQL acotado</text>
<text x="918" y="785" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Adaptador de solo lectura</text>
<path d="M239,813 L239,859" stroke="#7d94ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M449,589 L449,939 L467,939" stroke="#7d94ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M1081,813 L1081,859" stroke="#7d94ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="52" y="871" width="374" height="137" rx="14" fill="#101c2b" stroke="#2b4053" stroke-width="2"/>
<rect x="52" y="887" width="4" height="105" rx="2" fill="#70dba3"/>
<text x="76" y="908" fill="#70dba3" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">QDRANT / ARCHIVOS</text>
<text x="76" y="944" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Índice y versiones activas</text>
<text x="76" y="972" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Documentos corporativos</text>
<text x="76" y="1000" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Adjuntos por conversación</text>
<rect x="473" y="871" width="374" height="137" rx="14" fill="#101c2b" stroke="#2b4053" stroke-width="2"/>
<rect x="473" y="887" width="4" height="105" rx="2" fill="#b18bff"/>
<text x="497" y="908" fill="#b18bff" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">MYSQL / ESTADO</text>
<text x="497" y="944" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Usuarios, roles y sesiones</text>
<text x="497" y="972" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Conversaciones y operaciones</text>
<text x="497" y="1000" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Manifest de documentos</text>
<rect x="894" y="871" width="374" height="137" rx="14" fill="#101c2b" stroke="#2b4053" stroke-width="2"/>
<rect x="894" y="887" width="4" height="105" rx="2" fill="#efc776"/>
<text x="918" y="908" fill="#efc776" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">FUENTES CONFIGURADAS</text>
<text x="918" y="944" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">BD interna autorizada</text>
<text x="918" y="972" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Sin SQL libre del modelo</text>
<text x="918" y="1000" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Sin activar nuevas conexiones</text>
<text x="52" y="1041" fill="#a6b9cc" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">El backend persiste el estado en MySQL; el modelo recibe solamente el contexto autorizado.</text>
<rect x="52" y="1073" width="1216" height="113" rx="14" fill="#101c2b" stroke="#2b4053" stroke-width="2"/>
<rect x="52" y="1089" width="4" height="81" rx="2" fill="#eea66e"/>
<text x="76" y="1110" fill="#eea66e" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">OBSERVABILIDAD Y EVALUACIÓN</text>
<text x="76" y="1146" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">request_id · tiempos por etapa · carga de cola · errores clasificados · pruebas de ACL y grounding</text>
<text x="76" y="1174" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Las pruebas sintéticas no certifican la calidad de Gemma ni la capacidad de la GPU.</text>
<rect x="52" y="1213" width="1216" height="113" rx="14" fill="#101c2b" stroke="#2b4053" stroke-width="2"/>
<rect x="52" y="1229" width="4" height="81" rx="2" fill="#37d7e6"/>
<text x="76" y="1250" fill="#37d7e6" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">OPERACIÓN</text>
<text x="76" y="1286" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Windows: cuatro BAT, MySQL propio :3308 y Qdrant embebido. Docker/Linux: perfil alternativo.</text>
<text x="76" y="1314" fill="#dce6ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Localidad: inferencia y embeddings restringidos a endpoints aprobados; Entra opcional cambia la frontera de identidad.</text>
</svg>