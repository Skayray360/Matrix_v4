# Creado por Aldo Garcia.
name: Calidad y recuperacion vectorial

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Reconsulta avisos de seguridad aunque el codigo no cambie. Se activa en main.
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend y seguridad (datos sinteticos)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Arbol npm para las pruebas de suministro del backend
        working-directory: frontend
        run: corepack npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependencias fijadas, sin compilar paquetes
        run: |
          python -m pip install --only-binary=:all: uv==0.13.6
          uv sync --locked --extra dev --no-install-project --no-build
      - name: Inventario SBOM offline de ambos lockfiles
        run: .venv/bin/python -m scripts.generate_sbom --output var/reports/sbom.cdx.json
      - name: Conservar SBOM del commit probado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: backend/var/reports/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Lint y documentacion
        run: |
          .venv/bin/python -m ruff check app scripts seeds tests
          .venv/bin/python -m mypy app
          # Alcance app; excepciones por linea respaldadas por tests/security/test_sast_mitigations.py.
          .venv/bin/python -m bandit -q -r app
          .venv/bin/python -m scripts.verify_headers
          .venv/bin/python -m scripts.verify_documentation
          .venv/bin/python -m scripts.preflight --integrity-only
      - name: Suite completa de pruebas aisladas
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          import sys
          from dataclasses import asdict
          from scripts.run_quality_gate import PASS, TEST_REPORTS, _backend_tests
          TEST_REPORTS.mkdir(parents=True, exist_ok=True)
          result = _backend_tests(sys.executable, "standalone")
          print(json.dumps(asdict(result), indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Backend aislado: **{result.status}**. {result.detail}\n\n")
              summary.write("No acredita integracion MySQL/Ollama ni instalacion Windows.\n")
          raise SystemExit(0 if result.status == PASS and result.collection is not None else 1)
          PY
      - name: Secretos y dependencias conocidas
        run: |
          .venv/bin/python -m scripts.secrets_scan
          .venv/bin/python -m scripts.verify_supply_chain
          .venv/bin/python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path("uv.lock").read_text())
          packages = sorted({(p["name"], p["version"]) for p in lock["package"] if "registry" in p.get("source", {})})
          target = Path(os.environ["RUNNER_TEMP"]) / "matrix-lock-audit.txt"
          target.write_text("".join(f"{name}=={version}\n" for name, version in packages))
          PY
          .venv/bin/python -m pip_audit --progress-spinner off --disable-pip --no-deps -r "$RUNNER_TEMP/matrix-lock-audit.txt"

  frontend:
    name: Frontend y build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Instalar sin scripts de terceros
        run: corepack npm ci --ignore-scripts --no-audit --no-fund
      - name: Validar interfaz
        run: |
          corepack npm run typecheck
          corepack npm run lint
          corepack npm run format:check
          corepack npm test
          corepack npm run build
          corepack npm audit --audit-level=low
          corepack npm audit signatures
      - name: Dist distribuido reproducible byte a byte
        run: python ../backend/scripts/verify_frontend_dist.py
      - name: Navegador real con API sintetica
        run: |
          node node_modules/@playwright/test/cli.js install --with-deps --only-shell chromium
          node node_modules/@playwright/test/cli.js test --config=playwright.visual.config.ts
      - name: Conservar capturas y resultados del navegador
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-visual-${{ github.sha }}
          path: |
            frontend/test-results/
            reports/tests/visual-results.json
          retention-days: 14
          if-no-files-found: ignore

  windows_controller:
    name: Controlador Windows (${{ matrix.shell }}, sintetico)
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell
            major: 5
          - shell: pwsh
            major: 7
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python Windows exacto del manifiesto, verificado antes de extraer
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content -LiteralPath 'backend/config/runtime-manifest.json' -Raw | ConvertFrom-Json).python
          if ($pin.sha256 -notmatch '^[0-9a-f]{64}$' -or [long]$pin.size -le 0 -or
              $pin.version -notmatch '^\d+\.\d+\.\d+$' -or $pin.build -notmatch '^\d{8}$') {
              throw 'Pin Python incompleto o no valido.'
          }
          $origin = 'https://github.com/astral-sh/python-build-standalone/releases/download/'
          if (-not $pin.url.StartsWith($origin + $pin.build + '/', [StringComparison]::Ordinal)) {
              throw 'Origen Python fuera de la release fijada.'
          }
          $runtime = Join-Path $env:RUNNER_TEMP ('matrix-python-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $runtime | Out-Null
          $archive = Join-Path $runtime 'python.tar.gz'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -UseBasicParsing -Uri $pin.url -OutFile $archive -TimeoutSec 120
          if ((Get-Item -LiteralPath $archive).Length -ne [long]$pin.size -or
              (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pin.sha256) {
              throw 'El archivo Python no coincide con el tamano y SHA256 fijados; no se extrae.'
          }
          $tar = Join-Path $env:SystemRoot 'System32/tar.exe'
          & $tar -xzf $archive -C $runtime
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo extraer el runtime Python verificado.' }
          # install_only usa python/ como raiz; no elegir launchers de Lib/venv.
          $python = Join-Path $runtime 'python/python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Falta el interprete del runtime fijado.' }
          $version = & $python --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -cne ('Python ' + $pin.version)) {
              throw 'La version ejecutada no coincide con el manifiesto Python.'
          }
          & $python -I -c "import os, struct; assert os.name == 'nt' and struct.calcsize('P') == 8"
          if ($LASTEXITCODE -ne 0) { throw 'Se requiere el runtime Windows x64 fijado.' }
          [IO.File]::AppendAllText($env:GITHUB_PATH, (Split-Path -Parent $python) + [Environment]::NewLine,
                                  [Text.UTF8Encoding]::new($false))
          Write-Output ($version + '; artefacto ' + $pin.build + ' verificado por tamano y SHA256.')
      - name: Nueve fixtures aisladas, sin instalar ni arrancar servicios
        env:
          MATRIX_EXPECTED_PS_MAJOR: ${{ matrix.major }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $PSVersionTable.PSVersion
          if ($version.Major -ne [int]$env:MATRIX_EXPECTED_PS_MAJOR -or -not [Environment]::Is64BitProcess) {
              throw "La prueba requiere el PowerShell x64 indicado por la matriz."
          }
          if ($version.Major -eq 5 -and $version.Minor -ne 1) { throw "Se requiere PowerShell 5.1." }
          $engine = (Get-Process -Id $PID).Path
          $controller = Join-Path $PWD 'backend/scripts/windows/MatrixRH.ps1'
          $fixtures = @(Get-ChildItem 'backend/tests/unit/fixtures/native_supervisor_*.ps1' -File | Sort-Object Name)
          if ($fixtures.Count -ne 9) { throw "Inventario de fixtures inesperado; revise la cobertura del controlador." }
          foreach ($fixture in $fixtures) {
              # Cada fixture carga solo nodos AST de funciones y usa runtimes/servicios falsos.
              # PS5.1 convierte stderr nativo en ErrorRecord; capturarlo sin perder el diagnostico del hijo.
              $previousPreference = $ErrorActionPreference
              try {
                  $ErrorActionPreference = 'Continue'
                  $output = & $engine -NoLogo -NoProfile -NonInteractive -File $fixture.FullName -Controller $controller 2>&1
                  $code = $LASTEXITCODE
              } finally { $ErrorActionPreference = $previousPreference }
              $output | Write-Output
              if ($code -ne 0 -or ($output | Out-String) -notmatch 'SYNTHETIC PASS') {
                  throw "Fixture fallida: $($fixture.Name), exit=$code"
              }
          }
          "Controlador PS $version x64: **9/9 PASS**; datos sinteticos. No acredita instalacion WAMP/Ollama, servicios reales ni inferencia." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: DACL privada real en exportaciones sinteticas
        run: python backend/scripts/verify_chunk_export_acl.py --require-windows

  vector_recovery:
    name: Recuperacion vectorial (MySQL y Qdrant reales)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        # Indice OCI oficial mysql:8.4, verificado el 2026-10-27.
        image: mysql@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        env:
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-root
          MYSQL_DATABASE: matrix_rh_test_vectors
          MYSQL_USER: matrix_ci
          # Valor sintetico exclusivo de este contenedor efimero, no un secreto productivo.
          MYSQL_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-fixture
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
      qdrant:
        # Qdrant v1.20.0 oficial; sin volumen ni corpus externo.
        image: qdrant/qdrant@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
        env:
          QDRANT__TELEMETRY_DISABLED: "true"
        ports:
          - 6333/tcp
    env:
      APP_ENV: test
      APP_LOG_LEVEL: WARNING
      PYTHONNOUSERSITE: "1"
      MATRIX_TEST_ALLOW_DESTRUCTIVE: "true"
      MATRIX_TEST_REQUIRE_QDRANT_SERVER: "true"
      MATRIX_ADOPT_EXISTING_DATABASE: "true"
      UPLOAD_STORAGE_ROOT: ./var/tests/vector-recovery/uploads
      QDRANT_PATH: ./var/tests/vector-recovery/qdrant
      QDRANT_MODE: server
      RAG_COLLECTION_CORPORATE: matrix_rh_test_corporate
      RAG_COLLECTION_PRIVATE: matrix_rh_test_private
      MYSQL_TEST_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
      - name: Dependencias fijadas
        run: |
          python -m pip install --only-binary=:all: uv==0.13.6
          uv sync --locked --extra dev --no-install-project --no-build
      - name: Migraciones y pruebas de recuperacion sin omisiones
        env:
          QDRANT_URL: http://127.0.0.1:${{ job.services.qdrant.ports['6333'] }}
          MYSQL_TEST_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          import sys
          from dataclasses import asdict
          from pathlib import Path
          from sqlalchemy import URL
          os.environ["DATABASE_URL"] = URL.create(
              "mysql+pymysql", username="matrix_ci", password=os.environ["MYSQL_TEST_PASSWORD"],
              host="127.0.0.1", port=int(os.environ["MYSQL_TEST_PORT"]),
              database="matrix_rh_test_vectors", query={"charset": "utf8mb4"},
          ).render_as_string(hide_password=False)
          from scripts.test_environment import require_disposable_database
          require_disposable_database()
          from app.database.migrator import run_migrations
          print(f"Migraciones aplicadas: {len(run_migrations())}")
          from scripts.run_quality_gate import BACKEND_ROOT, PASS, _run
          reports = Path(os.environ["RUNNER_TEMP"]) / "vector-recovery"
          reports.mkdir(parents=True, exist_ok=True)
          all_complete = True
          for mode in ("server", "embedded"):
              os.environ["QDRANT_MODE"] = mode
              os.environ["MATRIX_TEST_REQUIRE_QDRANT_SERVER"] = "true" if mode == "server" else "false"
              junit, collection = reports / f"{mode}-junit.xml", reports / f"{mode}-collection.json"
              command = [sys.executable, "-m", "pytest", "tests/integration/test_generation_recovery_mysql.py",
                         "-q", "-p", "scripts.quality_gate_pytest", "--matrix-test-group", "integration_services",
                         "--matrix-collection-report", str(collection), "--junitxml", str(junit)]
              result = _run(command, cwd=BACKEND_ROOT, name=f"recuperacion MySQL/Qdrant {mode}",
                            require_complete_junit=junit)
              print(json.dumps(asdict(result), indent=2))
              inventory = json.loads(collection.read_text())
              complete = (result.status == PASS and inventory["selected"] > 0
                          and inventory["selected"] == inventory["collected_total"] == result.junit_testcases)
              all_complete = all_complete and complete
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(f"Recuperacion MySQL/Qdrant {mode}: **{'PASS' if complete else 'FAIL'}**, "
                                f"{result.junit_testcases} casos. Datos sinteticos y embeddings deterministas.\n\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Suite dirigida; no acredita toda la integracion, modelos, Windows o failover.\n")
          raise SystemExit(0 if all_complete else 1)
          PY
      - name: Cuentas locales y planificador con MySQL real
        env:
          QDRANT_URL: http://127.0.0.1:${{ job.services.qdrant.ports['6333'] }}
          MYSQL_TEST_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          import sys
          from dataclasses import asdict
          from pathlib import Path
          from sqlalchemy import URL
          os.environ["DATABASE_URL"] = URL.create(
              "mysql+pymysql", username="matrix_ci", password=os.environ["MYSQL_TEST_PASSWORD"],
              host="127.0.0.1", port=int(os.environ["MYSQL_TEST_PORT"]),
              database="matrix_rh_test_vectors", query={"charset": "utf8mb4"},
          ).render_as_string(hide_password=False)
          from scripts.test_environment import require_disposable_database
          require_disposable_database()
          from scripts.run_quality_gate import BACKEND_ROOT, PASS, _run
          reports = Path(os.environ["RUNNER_TEMP"]) / "lifecycle-scheduler"
          reports.mkdir(parents=True, exist_ok=True)
          junit, collection = reports / "junit.xml", reports / "collection.json"
          command = [sys.executable, "-m", "pytest",
                     "tests/integration/test_local_lifecycle_mysql.py",
                     "tests/integration/test_scheduler_freshness_mysql.py",
                     "tests/integration/test_conversation_visibility_mysql.py",
                     "-q", "-p", "scripts.quality_gate_pytest", "--matrix-test-group", "integration_services",
                     "--matrix-collection-report", str(collection), "--junitxml", str(junit)]
          result = _run(command, cwd=BACKEND_ROOT, name="cuentas y planificador MySQL",
                        require_complete_junit=junit)
          print(json.dumps(asdict(result), indent=2))
          inventory = json.loads(collection.read_text())
          complete = (result.status == PASS and inventory["selected"] > 0
                      and inventory["selected"] == inventory["collected_total"] == result.junit_testcases)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Cuentas y planificador MySQL: **{'PASS' if complete else 'FAIL'}**, "
                            f"{result.junit_testcases} casos. Datos sinteticos; sin modelos reales.\n")
          raise SystemExit(0 if complete else 1)
          PY

  docker_smoke:
    name: Docker limpio (HTTPS real, modelos sinteticos)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir imagen distribuida desde checkout limpio
        run: docker build --tag matrix-rh-backend:1.4.2 --file backend/Dockerfile .
      - name: Preparar configuracion privada como operador sin privilegios
        run: |
          test "$(id -u)" -ne 0
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/workspace" --entrypoint python \
            matrix-rh-backend:1.4.2 -m scripts.docker_prepare --root /workspace
          python - <<'PY'
          from pathlib import Path
          directory = Path("knowledge-base/documents/prestaciones")
          directory.mkdir(parents=True, exist_ok=True)
          (directory / "ci-synthetic.md").write_text(
              "# Fixture de despliegue\n\nDocumento sintetico exclusivo de CI. No constituye una politica empresarial.\n",
              encoding="utf-8",
          )
          PY
      - name: Validar Compose y ejecutar preparacion real
        run: |
          docker compose --env-file backend/config/docker.env -f docker-compose.yml \
            -f backend/tests/fixtures/docker_smoke/compose.yaml config --quiet
          docker compose --env-file backend/config/docker.env -f docker-compose.yml \
            -f backend/tests/fixtures/docker_smoke/compose.yaml run --rm prepare
      - name: Arrancar servicios y verificar HTTPS, identidad y documentos
        run: |
          docker compose --env-file backend/config/docker.env -f docker-compose.yml \
            -f backend/tests/fixtures/docker_smoke/compose.yaml up --detach --wait --wait-timeout 240 backend nginx
          python backend/tests/fixtures/docker_smoke/verify.py
          echo 'Docker limpio: build, preparacion, migraciones, ingesta, HTTPS, login y conversacion **PASS**. MySQL/Qdrant/Nginx reales; solo Ollama es simulado. No acredita pesos, calidad, GPU ni capacidad real.' >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnostico acotado sin credenciales
        if: failure()
        run: |
          if test -f backend/config/docker.env; then
            docker compose --env-file backend/config/docker.env -f docker-compose.yml \
              -f backend/tests/fixtures/docker_smoke/compose.yaml logs --no-color --tail 80 2>&1 \
              | python backend/tests/fixtures/docker_smoke/redact_logs.py
          fi
      - name: Retirar exclusivamente recursos efimeros del job
        if: always()
        run: |
          if test -f backend/config/docker.env; then
            docker compose --env-file backend/config/docker.env -f docker-compose.yml \
              -f backend/tests/fixtures/docker_smoke/compose.yaml ps --all
            docker compose --env-file backend/config/docker.env -f docker-compose.yml \
              -f backend/tests/fixtures/docker_smoke/compose.yaml down --volumes --remove-orphans --timeout 30
          fi
