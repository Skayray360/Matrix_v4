# Creado por Aldo Garcia.
# Preparar primero con scripts.docker_prepare; ver el unico README.md.
# APP_ENV=development es un perfil LOCAL. No acredita cifrado ni despliegue corporativo.
name: "matrixrh-${MATRIX_DOCKER_PROJECT_ID:?ejecute docker_prepare}"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  image: matrix-rh-backend:1.4.2
  build:
    context: .
    dockerfile: backend/Dockerfile
  user: "${MATRIX_DOCKER_UID:?ejecute docker_prepare}:${MATRIX_DOCKER_GID:?ejecute docker_prepare}"
  env_file:
    - ./backend/config/docker.env
  environment:
    APP_ENV: development
    APP_HOST: 0.0.0.0
    APP_PORT: "8000"
    APP_BASE_URL: https://127.0.0.1:8443
    AUTH_PROVIDER: local
    LOCAL_TEST_AUTH_ENABLED: "false"
    LOCAL_TEST_SEED_USERS_ENABLED: "false"
    SESSION_COOKIE_SECURE: "true"
    QDRANT_MODE: server
    QDRANT_URL: http://qdrant:6333
    OLLAMA_BASE_URL: http://ollama:11434
    LLM_LOCAL_ONLY: "true"
    LLM_LOCAL_HOSTS: 127.0.0.1,localhost,::1,ollama
    MATRIX_ADOPT_EXISTING_DATABASE: "true"
    FORWARDED_ALLOW_IPS: "${MATRIX_NGINX_IP:?ejecute docker_prepare}"
  depends_on:
    mysql:
      condition: service_healthy
    qdrant:
      condition: service_healthy
    ollama:
      condition: service_healthy
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
  mem_limit: 4g
  cpus: 2
  pids_limit: 256
  stop_grace_period: 45s
  networks: [matrix_data, matrix_llm, matrix_proxy]
  logging: *logging

services:
  # No abre los datadirs. Bloquea una imagen nueva sobre datos de otra version.
  storage-guard:
    image: matrix-rh-backend:1.4.2
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "${MATRIX_DOCKER_UID}:${MATRIX_DOCKER_GID}"
    entrypoint: [python, -m, scripts.docker_prepare]
    command: [--check-storage, --root, /app]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1
    pids_limit: 32
    healthcheck: {disable: true}
    volumes:
      - type: bind
        source: ./knowledge-base/state/docker/images.json
        target: /app/knowledge-base/state/docker/images.json
        read_only: true
        bind: {create_host_path: false}
      # Usar el Compose de la copia activa, incluso si la imagen backend es anterior.
      - type: bind
        source: ./docker-compose.yml
        target: /app/docker-compose.yml
        read_only: true
        bind: {create_host_path: false}
    logging: *logging

  mysql:
    image: mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    depends_on:
      storage-guard: {condition: service_completed_successfully}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: matrix_rh
      MYSQL_USER: matrixrh
      MYSQL_PASSWORD: "${MATRIX_DOCKER_MYSQL_PASSWORD:?ejecute docker_prepare}"
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root
    secrets: [mysql-root]
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes:
      - type: bind
        source: ./knowledge-base/state/docker/mysql
        target: /var/lib/mysql
        bind: {create_host_path: false}
    networks: [matrix_data]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" --host=127.0.0.1 --execute="SELECT 1" --silent >/dev/null'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging: *logging

  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    depends_on:
      storage-guard: {condition: service_completed_successfully}
    restart: unless-stopped
    user: "${MATRIX_DOCKER_UID}:${MATRIX_DOCKER_GID}"
    working_dir: /qdrant/storage
    entrypoint: [/qdrant/qdrant]
    command: [--config-path, /qdrant/config/config.yaml]
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?ejecute docker_prepare}"
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__SERVICE__ENABLE_CORS: "false"
      QDRANT__CLUSTER__ENABLED: "false"
      QDRANT__SERVICE__ENFORCE_INTERNAL_AUTH: "true"
    volumes:
      - type: bind
        source: ./knowledge-base/state/docker/qdrant
        target: /qdrant/storage
        bind: {create_host_path: false}
      - type: bind
        source: ./knowledge-base/state/docker/qdrant-snapshots
        target: /qdrant/snapshots
        bind: {create_host_path: false}
    networks: [matrix_data]
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=128m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\napi-key: %s\r\nConnection: close\r\n\r\n" "$$QDRANT__SERVICE__API_KEY" >&3; IFS= read -r line <&3; [[ "$$line" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *logging

  ollama:
    image: ollama/ollama:0.40.11@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
    depends_on:
      storage-guard: {condition: service_completed_successfully}
    restart: unless-stopped
    user: "${MATRIX_DOCKER_UID}:${MATRIX_DOCKER_GID}"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      HOME: /tmp
    volumes:
      - type: bind
        source: ./knowledge-base/state/docker/ollama
        target: /models
        bind: {create_host_path: false}
    networks: [matrix_llm]
    read_only: true
    tmpfs: [/tmp:rw,nosuid,size=1g,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: "${OLLAMA_MEMORY_LIMIT:-24g}"
    cpus: "${OLLAMA_CPUS:-4}"
    pids_limit: 512
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *logging

  backend:
    <<: *backend
    restart: unless-stopped
    command: [serve]
    volumes:
      - type: bind
        source: ./backend/config/docker.env
        target: /app/backend/config/docker.env
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./knowledge-base/documents
        target: /app/knowledge-base/documents
        bind: {create_host_path: false}
      - type: bind
        source: ./knowledge-base/state/docker/uploads
        target: /app/knowledge-base/state/uploads
        bind: {create_host_path: false}
      - type: bind
        source: ./knowledge-base/state/docker/run
        target: /app/knowledge-base/state/run
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 45s

  nginx:
    image: nginx:1.30.6-alpine-slim@sha256:dede8895648b461178c3bc604f7eed4423efe5220b2c4d839f5eb3d34ac3f8f7
    restart: unless-stopped
    user: "${MATRIX_DOCKER_UID}:${MATRIX_DOCKER_GID}"
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    depends_on:
      backend: {condition: service_healthy}
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - type: bind
        source: ./frontend/nginx/matrixrh.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./knowledge-base/state/docker/tls
        target: /etc/nginx/certs
        read_only: true
        bind: {create_host_path: false}
    networks:
      matrix_proxy:
        ipv4_address: "${MATRIX_NGINX_IP:?ejecute docker_prepare}"
      matrix_browser: {}
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m,mode=1777
      - /var/run:rw,noexec,nosuid,size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, wget, -q, --no-check-certificate, -O, /dev/null, "https://127.0.0.1:8443/proxy-health"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *logging

  # Solo preparar, despues de "down"; no ejecutar junto a ollama sobre los mismos pesos.
  model-download:
    profiles: [prepare]
    image: ollama/ollama:0.40.11@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
    depends_on:
      storage-guard: {condition: service_completed_successfully}
    user: "${MATRIX_DOCKER_UID}:${MATRIX_DOCKER_GID}"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        ollama serve &
        runtime_pid=$$!
        trap 'kill -TERM "$$runtime_pid" 2>/dev/null || true; wait "$$runtime_pid" || true' EXIT INT TERM
        attempt=0
        until ollama list >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          [ "$$attempt" -lt 60 ] || exit 1
          sleep 1
        done
        ollama show "$$GENERATION_MODEL" >/dev/null 2>&1 || ollama pull "$$GENERATION_MODEL"
        ollama show "$$EMBEDDING_MODEL" >/dev/null 2>&1 || ollama pull "$$EMBEDDING_MODEL"
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      GENERATION_MODEL: "${OLLAMA_FAST_MODEL:?ejecute docker_prepare}"
      EMBEDDING_MODEL: "${OLLAMA_EMBEDDING_MODEL:?ejecute docker_prepare}"
      HOME: /tmp
    volumes:
      - type: bind
        source: ./knowledge-base/state/docker/ollama
        target: /models
        bind: {create_host_path: false}
    networks: [matrix_download]
    read_only: true
    tmpfs: [/tmp:rw,nosuid,size=1g,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 128
    logging: *logging

  prepare:
    <<: *backend
    profiles: [prepare]
    restart: "no"
    command: [prepare]
    healthcheck: {disable: true}
    volumes:
      - type: bind
        source: ./backend/config
        target: /app/backend/config
        bind: {create_host_path: false}
      - type: bind
        source: ./knowledge-base/documents
        target: /app/knowledge-base/documents
        bind: {create_host_path: false}
      - type: bind
        source: ./knowledge-base/state/docker/uploads
        target: /app/knowledge-base/state/uploads
        bind: {create_host_path: false}
      - type: bind
        source: ./knowledge-base/state/docker/run
        target: /app/knowledge-base/state/run
        bind: {create_host_path: false}

secrets:
  mysql-root:
    file: ./backend/config/secrets/docker/mysql-root-password.txt

networks:
  matrix_data: {internal: true}
  matrix_llm: {internal: true}
  matrix_proxy:
    internal: true
    ipam:
      config:
        - subnet: "${MATRIX_PROXY_SUBNET:?ejecute docker_prepare}"
  matrix_browser: {}
  matrix_download: {}
